<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #1e1811;
        color: #ece5d8;
      }
      h1 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ffb020;
        margin: 0 0 4px;
      }
      .sub {
        font-size: 11px;
        color: #a99d8a;
        margin-bottom: 14px;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #786d5c;
        margin-bottom: 5px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        background: #251e17;
        border: 1px solid #332a20;
        border-radius: 4px;
        color: #ece5d8;
        font-size: 13px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #ffb020;
        box-shadow: 0 0 0 3px rgba(255, 176, 32, 0.14);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 9px 12px;
        border-radius: 4px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid #332a20;
      }
      .save {
        background: #ffb020;
        color: #1a1206;
        border-color: #ffb020;
      }
      .save:disabled { opacity: 0.5; cursor: default; }
      .disconnect {
        background: transparent;
        color: #e5555a;
        border-color: rgba(229, 85, 90, 0.4);
      }
      #status {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 4px;
        font-size: 11.5px;
        line-height: 1.45;
        display: none;
      }
      #status.ok {
        display: block;
        background: rgba(127, 203, 150, 0.1);
        border: 1px solid rgba(127, 203, 150, 0.3);
        color: #7fcb96;
      }
      #status.err {
        display: block;
        background: rgba(229, 85, 90, 0.1);
        border: 1px solid rgba(229, 85, 90, 0.3);
        color: #e5555a;
      }
      #state {
        margin-top: 12px;
        font-size: 11px;
        color: #786d5c;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      #state .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }
      #state .dot.on { background: #7fcb96; box-shadow: 0 0 5px #7fcb96; }
      #state .dot.off { background: #453e32; }
      .hint {
        font-size: 10.5px;
        color: #786d5c;
        margin-top: 10px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Agent Harness Relay</h1>
    <div class="sub">
      Connects your logged-in Chrome to the agent so it can browse login-walled
      job sites. Credentials never leave your browser.
    </div>

    <label for="worker-url">Worker URL</label>
    <input
      id="worker-url"
      type="text"
      placeholder="https://agent-harness.you.workers.dev"
      spellcheck="false"
      autocomplete="off"
    />

    <div class="row">
      <button id="save" class="save" disabled>Save & Connect</button>
      <button id="disconnect" class="disconnect">Disconnect</button>
    </div>

    <div id="status"></div>
    <div id="state"><span class="dot off"></span>checking…</div>

    <div class="hint">
      For local dev: <code>http://localhost:8787</code>. Keep a tab open and
      focused while the agent browses — it drives the active tab.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
